<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miller's English Adventure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Miller 的國小英語互動闖關：Unit 1 What a Day!、Unit 2 In the Classroom 與總複習，共 5 關。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FFF7E6; --bg-2:#E3F2FF; --bg-3:#F1ECFF;
  --card:#FFFFFF; --card-2:#F6F8FC;
  --ink:#1E293B; --muted:#64748B; --line:#E2E8F0;
  --ok:#059669; --ok-bg:#DCFCE7; --bad:#E11D48; --bad-bg:#FFE4E6;
  --hl:#DB2777; --star:#F59E0B; --star-off:#D6DCE5;
  --clock-face:#FFFFFF; --tick:#CBD5E1; --tick-big:#F59E0B; --hand-h:#2563EB; --hand-m:#F97316;
  --c1:#FBBF24; --c1-bg:#FEF3C7; --c1-ink:#92400E; --c1-sh:#B45309;
  --c2:#FB923C; --c2-bg:#FFEDD5; --c2-ink:#9A3412; --c2-sh:#C2410C;
  --c3:#38BDF8; --c3-bg:#E0F2FE; --c3-ink:#075985; --c3-sh:#0284C7;
  --c4:#A78BFA; --c4-bg:#EDE9FE; --c4-ink:#5B21B6; --c4-sh:#7C3AED;
  --c5:#34D399; --c5-bg:#D1FAE5; --c5-ink:#065F46; --c5-sh:#059669;
  --a:var(--c3); --a-bg:var(--c3-bg); --a-ink:var(--c3-ink); --a-sh:var(--c3-sh); --a-on:#0C2A3F;
  --shadow:0 1px 0 rgba(15,23,42,.04),0 12px 28px -14px rgba(15,23,42,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1525; --bg-2:#10223A; --bg-3:#1D1838;
    --card:#18233A; --card-2:#121B2E;
    --ink:#EEF2F7; --muted:#9AA8BC; --line:#2C3A55;
    --ok:#34D399; --ok-bg:#0B3B2C; --bad:#FB7185; --bad-bg:#43111F;
    --hl:#F472B6; --star-off:#3A4763;
    --clock-face:#0E1525; --tick:#3A4763;
    --c1-bg:#3A2A0C; --c1-ink:#FCD34D; --c2-bg:#3B220F; --c2-ink:#FDBA74;
    --c3-bg:#0C2B40; --c3-ink:#7DD3FC; --c4-bg:#271F48; --c4-ink:#C4B5FD;
    --c5-bg:#0A3529; --c5-ink:#6EE7B7;
    --shadow:0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1525; --bg-2:#10223A; --bg-3:#1D1838;
  --card:#18233A; --card-2:#121B2E;
  --ink:#EEF2F7; --muted:#9AA8BC; --line:#2C3A55;
  --ok:#34D399; --ok-bg:#0B3B2C; --bad:#FB7185; --bad-bg:#43111F;
  --hl:#F472B6; --star-off:#3A4763;
  --clock-face:#0E1525; --tick:#3A4763;
  --c1-bg:#3A2A0C; --c1-ink:#FCD34D; --c2-bg:#3B220F; --c2-ink:#FDBA74;
  --c3-bg:#0C2B40; --c3-ink:#7DD3FC; --c4-bg:#271F48; --c4-ink:#C4B5FD;
  --c5-bg:#0A3529; --c5-ink:#6EE7B7;
  --shadow:0 12px 28px -14px rgba(0,0,0,.6);
}
[data-lv="1"]{--a:var(--c1);--a-bg:var(--c1-bg);--a-ink:var(--c1-ink);--a-sh:var(--c1-sh);--a-on:#3B1D02}
[data-lv="2"]{--a:var(--c2);--a-bg:var(--c2-bg);--a-ink:var(--c2-ink);--a-sh:var(--c2-sh);--a-on:#3B1305}
[data-lv="3"]{--a:var(--c3);--a-bg:var(--c3-bg);--a-ink:var(--c3-ink);--a-sh:var(--c3-sh);--a-on:#0C2A3F}
[data-lv="4"]{--a:var(--c4);--a-bg:var(--c4-bg);--a-ink:var(--c4-ink);--a-sh:var(--c4-sh);--a-on:#2E1065}
[data-lv="5"]{--a:var(--c5);--a-bg:var(--c5-bg);--a-ink:var(--c5-ink);--a-sh:var(--c5-sh);--a-on:#022C22}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(900px 500px at -10% -10%,var(--bg-2),transparent 60%),radial-gradient(800px 500px at 110% 110%,var(--bg-3),transparent 60%);
  color:var(--ink); font-family:'Fredoka','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit;color:inherit}
h2,h3,h4,p{margin:0}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-block:8px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--card)}
.ico{height:1em;width:auto;vertical-align:-.12em}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:880px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.brand .logo{flex:none;width:40px;height:40px;border-radius:12px;background:var(--c3-bg);display:grid;place-items:center;font-size:1.5rem}
.brand b{display:block;font-size:1.05rem;font-weight:700;line-height:1.15}
.brand small{display:block;font-size:.75rem;color:var(--muted)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);font-weight:600;font-size:.9rem;white-space:nowrap}
.tbtn{height:38px;min-width:38px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.9rem;font-weight:600;white-space:nowrap}
@media (max-width:520px){.brand small{display:none}.brand b{font-size:.92rem}.tbtn .lbl{display:none}.pill{padding:6px 8px}}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.btn{appearance:none;border:0;border-radius:16px;padding:12px 20px;font-weight:600;font-size:1.05rem;background:var(--a);color:var(--a-on);box-shadow:0 4px 0 var(--a-sh);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--a-sh)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.big{font-size:1.15rem;padding:14px 26px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--a-sh)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.row-c{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.say-btn{border:0;background:var(--a-bg);color:var(--a-ink);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:.92rem;font-weight:600;vertical-align:middle}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:3px 10px;margin:2px 2px;cursor:pointer;font-weight:600;font-size:.95rem}
.chip:hover{border-color:var(--a)}
.hl b,.got b,.chip b,.tbl b{color:var(--hl)}
.stars{letter-spacing:2px;font-size:1.05rem;color:var(--star-off)}
.stars .on{color:var(--star)}

/* map */
.hero{display:flex;gap:14px;align-items:center;margin:18px 0 6px}
.penny{font-size:2.8rem;width:72px;height:72px;flex:none;border-radius:22px;background:var(--c3-bg);display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;flex:1;box-shadow:var(--shadow)}
.bubble:before{content:'';position:absolute;left:-9px;top:26px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble p{font-weight:500;margin-bottom:6px}
.unit{margin-top:22px}
.unit-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:0 0 10px}
.unit-h .tag{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--a);color:var(--a-on)}
.unit-h h3{font-size:1.2rem}
.unit-h .uzh{color:var(--muted);font-size:.9rem}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.lv{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:14px;cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .1s,border-color .1s}
.lv:hover{transform:translateY(-2px);border-color:var(--a)}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.lv .num{width:60px;height:60px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:1.9rem;background:var(--a-bg);position:relative}
.lv .num b{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--a);color:var(--a-on);font-size:.85rem;display:grid;place-items:center;box-shadow:0 2px 0 var(--a-sh)}
.lv-t{display:block;min-width:0}
.lv-t .t{display:block;font-weight:700;font-size:1.12rem;line-height:1.25}
.lv-t .e{display:block;font-size:.82rem;color:var(--a-ink);font-weight:600}
.lv-t .s{display:block;font-size:.84rem;color:var(--muted);margin:3px 0 4px;line-height:1.35}
.lv .go{font-size:.85rem;font-weight:700;color:var(--a-ink);background:var(--a-bg);border-radius:999px;padding:1px 10px;margin-left:6px}
.foot{margin-top:30px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.foot .links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.link{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.85rem}
.link.armed{border-color:var(--bad);color:var(--bad)}

/* level */
.lv-head{display:flex;align-items:center;gap:12px;margin:14px 0 12px}
.back{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:1.2rem;font-weight:700}
.back.armed{border-color:var(--bad);color:var(--bad)}
.lv-head .num{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:1.7rem;background:var(--a-bg)}
.lv-head .ut{font-size:.8rem;font-weight:700;color:var(--a-ink)}
.lv-head h2{font-size:1.35rem;line-height:1.2}
.lv-head h2 small{font-size:.85rem;color:var(--muted);font-weight:500;margin-left:4px}
@media (max-width:520px){.lv-head h2 small{display:block;margin-left:0}}
.steps{display:flex;gap:8px;margin:0 0 14px}
.step{flex:1;text-align:center;padding:8px;border-radius:14px;background:var(--card-2);border:2px solid var(--line);font-weight:600;color:var(--muted);font-size:.95rem;cursor:pointer}
.step.on{background:var(--a-bg);border-color:var(--a);color:var(--a-ink);cursor:default}
.tip{display:flex;gap:10px;align-items:center;background:var(--a-bg);color:var(--a-ink);border-radius:16px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.tip span{font-size:1.6rem}
.block{margin-bottom:16px}
.block h3{font-size:1.18rem;margin-bottom:2px}
.block .sub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;cursor:pointer;text-align:left;transition:transform .1s,border-color .1s,background .2s;position:relative;display:flex;flex-direction:column}
.tile:hover{border-color:var(--a);transform:translateY(-2px)}
.tile .e{font-size:2.1rem;line-height:1.2}
.tile .en{font-weight:600;font-size:1.06rem;line-height:1.25;margin-top:2px}
.tile .zh{color:var(--muted);font-size:.86rem}
.tile .ex{margin-top:8px;font-size:.8rem;color:var(--a-ink);background:var(--a-bg);border-radius:8px;padding:4px 8px;line-height:1.35}
.tile:after{content:'🔊';position:absolute;top:10px;right:10px;font-size:.8rem;opacity:.45}
.playing{border-color:var(--a)!important;background:var(--a-bg)!important}
.dlg{display:grid;gap:10px}
.qa{border:2px solid var(--line);border-radius:16px;padding:6px 8px;background:var(--card)}
.line{display:flex;gap:10px;align-items:flex-start;padding:6px;cursor:pointer;border-radius:10px;background:none;border:0;width:100%;text-align:left}
.line:hover{background:var(--card-2)}
.who{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;margin-top:1px}
.who.q{background:var(--c3-bg);color:var(--c3-ink)}
.who.a{background:var(--ok-bg);color:var(--ok)}
.line .t{font-weight:600;font-size:1.05rem}
.line .t b{color:var(--hl)}
.line .zh,.sent .zh{display:block;font-weight:400;font-size:.86rem;color:var(--muted)}
.hide-zh .line .zh,.hide-zh .sent .zh{display:none}
.rule{background:var(--a-bg);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:.98rem}
.rule p+p,.rule p+table,.rule table+p{margin-top:8px}
.rule ol{margin:0;padding-left:1.3em}
.rule li+li{margin-top:6px}
.rule .note{color:var(--a-ink);font-weight:500}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
.tbl th{background:var(--card-2);font-size:.82rem;color:var(--muted)}
.ph{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ph-group{border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--card)}
.ph-tag{font-weight:700;font-size:1.3rem;color:var(--a-ink);background:var(--a-bg);border-radius:10px;padding:0 12px;display:inline-block;margin-bottom:8px}
.ph-words{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ph-w{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:6px 4px;cursor:pointer}
.ph-w .pe{font-size:1.5rem;line-height:1.2}
.ph-w .pw{font-size:1.25rem;font-weight:600}
.ph-w .pz{font-size:.78rem;color:var(--muted)}
.story{display:grid;gap:6px}
.sent{display:block;text-align:left;width:100%;border:2px solid transparent;background:var(--card-2);padding:9px 12px;border-radius:12px;cursor:pointer;font-size:1.06rem;font-weight:500}
.sent b{color:var(--hl)}
.sent.main{border-color:var(--a);border-style:dashed}
.sent .mark{font-size:.75rem;background:var(--a);color:var(--a-on);border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:700;white-space:nowrap}
.sent.reading{background:var(--a-bg);border-color:var(--a)}
.ctry{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ctry-c{border:2px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:6px;align-content:start}
.ctry-h{display:flex;align-items:center;gap:8px;font-weight:700}
.ctry-h span{font-size:1.8rem}
.ctry .sent{font-size:.98rem}
.s4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.s4c{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px;cursor:pointer;text-align:left;display:grid;gap:6px}
.s4c:hover{border-color:var(--a)}
.s4t{font-size:1.05rem}
.s4t b{font-size:1.3rem;color:var(--hl)}
.s4t small{font-size:.8rem;background:var(--a-bg);color:var(--a-ink);border-radius:999px;padding:1px 8px;margin-left:4px;font-weight:600}
.s4e{font-weight:600;color:var(--a-ink)}
.poss{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.poss-c{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;cursor:pointer;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}
.poss-c:hover{border-color:var(--a)}
.poss-c .ps{font-size:.9rem;color:var(--muted)}
.poss-c .pp{font-size:1.3rem;font-weight:700;color:var(--hl);grid-column:1}
.poss-c .pz{font-size:.85rem;grid-column:2;grid-row:2}
.poss-c .px{grid-column:1 / -1;font-size:.82rem;color:var(--a-ink)}
.cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;margin-top:20px;z-index:5}
.cta .btn{box-shadow:0 4px 0 var(--a-sh),0 10px 24px -6px rgba(15,23,42,.35)}

/* scene (near / far) */
.scene{display:flex;align-items:flex-end;gap:6px;padding:12px 14px 10px;border-radius:18px;background:linear-gradient(180deg,var(--card-2),var(--a-bg));border:2px solid var(--line);min-height:112px}
.scene .kid{display:flex;flex-direction:column;align-items:center;flex:none}
.scene .ke{font-size:2.6rem;line-height:1}
.scene .kn{font-size:.72rem;font-weight:700;background:var(--card);border-radius:999px;padding:0 8px;border:1px solid var(--line)}
.scene .hand{font-size:1.4rem;align-self:center;flex:none}
.scene .path{flex:1;min-width:24px;border-bottom:3px dashed var(--muted);opacity:.45;margin-bottom:24px}
.scene .grow{flex:1}
.scene .spot{display:flex;flex-direction:column;align-items:center;flex:none}
.scene .its{display:flex;gap:2px;line-height:1.1}
.scene .near .its{font-size:2.4rem}
.scene .far .its{font-size:1.45rem}
.scene .dist{font-size:.7rem;font-weight:700;padding:0 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-top:4px;white-space:nowrap}
.scene .tag{font-size:.75rem;font-weight:700;background:#FEF08A;color:#713F12;border-radius:6px;padding:1px 6px;margin-bottom:4px;white-space:nowrap}

/* clock */
.clockbox{display:flex;flex-direction:column;align-items:center;gap:8px}
svg.clock{width:min(230px,66vw);height:auto;display:block}
.clock .face{fill:var(--clock-face);stroke:var(--c1);stroke-width:8}
.clock .tk{stroke:var(--tick);stroke-width:1.5;stroke-linecap:round}
.clock .tk.b{stroke:var(--tick-big);stroke-width:3}
.clock text{fill:var(--ink);font:600 17px 'Fredoka',system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.clock .hh{stroke:var(--hand-h);stroke-width:8;stroke-linecap:round}
.clock .mh{stroke:var(--hand-m);stroke-width:5;stroke-linecap:round}
.clock .hand{transform-origin:100px 100px;transition:transform .45s cubic-bezier(.3,1.3,.6,1)}
.clock .pin{fill:var(--c1);stroke:var(--clock-face);stroke-width:2}
.legend{font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;vertical-align:middle;margin:0 4px 0 8px}
.ctrls{display:grid;gap:8px}
.ctrl{display:flex;align-items:center;gap:8px;justify-content:center}
.ctrl span{font-weight:600;font-size:.92rem;min-width:84px;text-align:right}
.ctrl button{width:48px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:1.3rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.ctrl button:active{transform:translateY(2px);box-shadow:none}
.clock-learn{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.clock-side{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:240px;flex:1}
.digital{font-size:2rem;font-weight:700;color:var(--a-ink);background:var(--a-bg);border-radius:16px;padding:4px 18px}
.dzh{color:var(--muted);margin-top:-6px}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* quiz */
.qbar{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.track{flex:1;height:14px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:var(--a);border-radius:999px;transition:width .4s}
.qcount{font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.qcard{text-align:center;padding:20px 16px}
.qcat{display:inline-block;font-size:.8rem;font-weight:700;color:var(--muted);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.htext{margin-top:12px;text-align:left}
.sent.hq{font-weight:700}
[hidden]{display:none!important}
.lead{font-size:2.6rem;line-height:1.25;margin-bottom:4px}
.qtag{display:inline-block;font-weight:700;font-size:.95rem;background:var(--a-bg);color:var(--a-ink);border-radius:999px;padding:2px 12px;margin-bottom:6px}
.prompt{font-size:1.4rem;font-weight:600;margin:10px 0 4px;line-height:1.35}
.prompt.sm{font-size:1.05rem;color:var(--muted);font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--a);margin:0 4px;color:var(--a-ink)}
.qzh{color:var(--muted);margin:0 0 6px}
.target{font-size:1.7rem;font-weight:700;color:var(--a-ink)}
.big-listen{width:96px;height:96px;border-radius:50%;border:0;background:var(--a);color:var(--a-on);font-size:2.6rem;cursor:pointer;box-shadow:0 6px 0 var(--a-sh);margin:6px auto 0;display:grid;place-items:center}
.big-listen:active{transform:translateY(4px);box-shadow:0 2px 0 var(--a-sh)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts.long{grid-template-columns:1fr}
@media (max-width:520px){.opts:not(.pics){grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:13px 12px;font-weight:600;font-size:1.08rem;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:hover{border-color:var(--a)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opts.done .opt{cursor:default}
.opts.done .opt:not(.ok):not(.bad){opacity:.45}
.pics .opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px}
.pics .pe{font-size:3rem;line-height:1.1}
.pics .pl{font-size:.92rem;visibility:hidden}
.opts.done .pl{visibility:visible}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;text-align:left;animation:pop .25s ease-out}
.fb.ok{background:var(--ok-bg);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.fb-h{font-weight:700;font-size:1.12rem}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb-ans{font-weight:600;font-size:1.1rem;margin:6px 0}
.fb-why{font-size:.96rem}
.fb .btn{margin-top:12px;width:100%}
.ans-line{min-height:64px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0 12px;background:var(--card-2)}
.ans-line.ok{border-color:var(--ok);background:var(--ok-bg)}
.ans-line.bad{border-color:var(--bad);background:var(--bad-bg)}
.ans-hint{color:var(--muted);font-size:.92rem}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px}
.wt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:600;font-size:1.1rem;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ans-line .wt{background:var(--a-bg);border-color:var(--a);color:var(--a-ink);box-shadow:0 3px 0 var(--a-sh)}
.wt.used{visibility:hidden}
.sort-stage{min-height:150px;display:flex;flex-direction:column;align-items:center}
.sort-item{display:inline-flex;flex-direction:column;align-items:center;gap:0;padding:12px 26px;border-radius:20px;background:var(--card);border:3px solid var(--a);box-shadow:0 5px 0 var(--a-sh);margin:8px auto 6px;cursor:pointer;animation:pop .25s ease-out}
.sort-item .e{font-size:2.5rem;line-height:1.2}
.sort-item .w{font-size:1.6rem;font-weight:700}
.sort-item small{color:var(--muted);font-size:.78rem}
.sort-count{font-size:.85rem;color:var(--muted)}
.bins{display:grid;gap:10px;grid-template-columns:repeat(var(--n),1fr);margin-top:10px}
.bin{border:2px dashed var(--a);background:var(--a-bg);border-radius:18px;padding:12px 6px;cursor:pointer;color:var(--a-ink);min-height:118px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bin:hover{border-style:solid}
.bin .bt{font-size:1.4rem;font-weight:700;line-height:1.2}
.bin .bs{font-size:.8rem}
.bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.bin .got span{font-size:.88rem;background:var(--card);color:var(--ink);border-radius:8px;padding:1px 7px}
.sort-msg{min-height:1.6em;margin-top:10px;font-weight:600}
.sort-msg.ok{color:var(--ok)}
.sort-msg.bad{color:var(--bad)}
.center{text-align:center}
.big-e{font-size:3.4rem;line-height:1.2}

/* result */
.big-stars{font-size:3.4rem;letter-spacing:6px;margin:4px 0}
.big-stars span{display:inline-block;color:var(--star-off);transform:scale(0);animation:starIn .5s forwards}
.big-stars span.on{color:var(--star)}
.big-stars span:nth-child(2){animation-delay:.25s}
.big-stars span:nth-child(3){animation-delay:.5s}
.score{font-size:1.1rem;font-weight:600}
.review{text-align:left;margin-top:16px}
.review h4{font-size:1rem;margin-bottom:6px}
.review ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.review li{background:var(--card-2);border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.review .mq{color:var(--muted);font-size:.9rem;flex:1 1 100%}
.review .ma{font-weight:600;color:var(--ok)}
.unlock{display:inline-block;margin-top:10px;background:var(--c5-bg);color:var(--c5-ink);border-radius:999px;padding:4px 14px;font-weight:600}

/* certificate */
.cert{border:6px double var(--c1-sh);border-radius:26px;padding:28px 18px;text-align:center;background:linear-gradient(135deg,var(--c1-bg),var(--card) 55%,var(--c3-bg));margin-top:16px}
.cert .k{letter-spacing:.18em;text-transform:uppercase;font-size:.8rem;color:var(--muted);font-weight:600}
.cert h2{font-size:2rem;margin:6px 0}
.cert .name{font-size:2.8rem;font-weight:700;color:var(--c4-ink);border-bottom:3px solid var(--c1);display:inline-block;padding:0 24px;margin:6px 0 10px;line-height:1.2}
.cert .lvls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.cert .lvls span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.88rem}
.cert .total{font-size:1.4rem;font-weight:700;color:var(--c1-ink)}
.cert .d{color:var(--muted);font-size:.9rem;margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.95rem;transition:all .25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes starIn{60%{transform:scale(1.25)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.big-stars span{transform:none}}
@media print{
  .topbar,.no-print,#toast{display:none!important}
  body{background:#fff}
  .cert{margin:0;box-shadow:none}
}
</style>

<body>
<header class="topbar">
  <div class="in">
    <button class="brand" data-act="map" aria-label="回到關卡地圖">
      <span class="logo" aria-hidden="true">🐧</span>
      <span><b id="brandName">Miller's English Adventure</b><small>Unit 1–2 英語闖關・5 個關卡</small></span>
    </button>
    <span class="spacer"></span>
    <span class="pill" title="星星總數">⭐ <b id="starNum">0</b>/15</span>
    <button class="tbtn" id="speedBtn" data-act="speed" title="朗讀速度">🙂</button>
    <button class="tbtn" id="soundBtn" data-act="sound" title="音效開關">🔔</button>
  </div>
</header>
<main id="app" class="wrap"><noscript>請開啟 JavaScript 才能開始闖關。</noscript></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ===== 學習者名字：要換人，只要改這一行 ===== */
const LEARNER = 'Miller';
/* 線上分享版不能開列印視窗，會改成 false */
const CAN_PRINT = true;

/* ===================== helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plain = s => String(s).replace(/[\[\]*]/g, '');
const hl = s => esc(s).replace(/\[([^\]]+)\]/g, '<b>$1</b>');
const md = s => esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const pad = m => String(m).padStart(2, '0');
const BOTTLE = '<svg class="ico" viewBox="0 0 32 48" aria-label="water bottle"><rect x="11" y="1" width="10" height="8" rx="2" fill="#0369A1"/><rect x="6" y="8" width="20" height="38" rx="7" fill="#7DD3FC" stroke="#0369A1" stroke-width="2"/><rect x="7" y="23" width="18" height="11" fill="#38BDF8"/></svg>';
const ico = s => String(s).replace(/BOTTLE/g, BOTTLE);

/* ===================== save ===================== */
const STORE = 'miller-english-adventure-v1';
let save = { best: {}, rate: 0.85, sound: true };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(save)); } catch (e) {} };
const totalStars = () => [1, 2, 3, 4, 5].reduce((s, n) => s + (save.best[n] || 0), 0);

/* ===================== speech (English only) ===================== */
const TTS = {
  ok: 'speechSynthesis' in window, voice: null, token: 0,
  pick() {
    try {
      const vs = speechSynthesis.getVoices();
      const us = vs.filter(v => /^en[-_]US/i.test(v.lang));
      this.voice = us.find(v => /Google US English|Samantha|Aria|Jenny|Ava|Natural/i.test(v.name)) || us[0] || vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) {}
  },
  clean: t => String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/[　-〿㐀-鿿＀-￯]/g, ' ').replace(/[*\[\]]/g, '').replace(/…/g, ' ').replace(/\s+/g, ' ').trim(),
  utter(text) { const u = new SpeechSynthesisUtterance(this.clean(text)); u.lang = 'en-US'; if (this.voice) u.voice = this.voice; u.rate = save.rate; u.pitch = 1.05; return u; },
  say(text) { if (!this.ok || !text) return; this.token++; $$('.reading').forEach(n => n.classList.remove('reading')); speechSynthesis.cancel(); speechSynthesis.speak(this.utter(text)); },
  sayList(list, onStep) {
    if (!this.ok) return;
    speechSynthesis.cancel(); $$('.reading').forEach(n => n.classList.remove('reading'));
    const tk = ++this.token; let i = 0;
    const next = () => {
      if (tk !== this.token) return;
      if (i >= list.length) { onStep(-1); return; }
      onStep(i);
      const u = this.utter(list[i++]);
      u.onend = () => setTimeout(next, 280);
      u.onerror = () => { if (tk === this.token) onStep(-1); };
      speechSynthesis.speak(u);
    };
    next();
  }
};
if (TTS.ok) { TTS.pick(); speechSynthesis.onvoiceschanged = () => TTS.pick(); }

/* ===================== sound fx ===================== */
const SFX = {
  ctx: null,
  tone(f, type, d, delay = 0, vol = 0.16) {
    if (!save.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx; if (c.state === 'suspended') c.resume();
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + delay;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  },
  good() { [523, 659, 784].forEach((f, i) => this.tone(f, 'triangle', 0.18, i * 0.08)); },
  bad() { this.tone(300, 'sine', 0.18); this.tone(220, 'sine', 0.25, 0.12); },
  pop() { this.tone(720, 'sine', 0.07, 0, 0.1); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 'triangle', 0.22, i * 0.11)); }
};

function confetti(n = 90) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#F59E0B', '#38BDF8', '#34D399', '#F43F5E', '#A78BFA', '#FACC15'];
  const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - 0.5) * W * 0.35, y: H * 0.6, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 6, r: Math.random() * 6 + 5, c: pick(cols), a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3 }));
  let t = 0;
  (function f() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += 0.42; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++t < 110) requestAnimationFrame(f); else c.remove();
  })();
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }

/* ===================== clock ===================== */
const r1 = n => Math.round(n * 10) / 10;
const norm = t => ((t % 720) + 720) % 720;
const fmtT = t => { t = norm(t); return `${Math.floor(t / 60) || 12}:${pad(t % 60)}`; };
const zhT = t => { t = norm(t); const h = Math.floor(t / 60) || 12, m = t % 60; return `${h} 點${m === 0 ? '整' : m === 30 ? '半' : ` ${m} 分`}`; };
function clockSVG(t, id = '') {
  let s = `<svg class="clock"${id ? ` id="${id}"` : ''} viewBox="0 0 200 200" role="img" aria-label="時鐘"><circle class="face" cx="100" cy="100" r="92"/>`;
  for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, b = i % 5 === 0, rr = b ? 74 : 80; s += `<line class="tk${b ? ' b' : ''}" x1="${r1(100 + 86 * Math.sin(a))}" y1="${r1(100 - 86 * Math.cos(a))}" x2="${r1(100 + rr * Math.sin(a))}" y2="${r1(100 - rr * Math.cos(a))}"/>`; }
  for (let n = 1; n <= 12; n++) { const a = n * Math.PI / 6; s += `<text x="${r1(100 + 61 * Math.sin(a))}" y="${r1(100 - 61 * Math.cos(a))}">${n}</text>`; }
  s += `<line class="hand hh" x1="100" y1="110" x2="100" y2="55" style="transform:rotate(${t / 2}deg)"/><line class="hand mh" x1="100" y1="114" x2="100" y2="28" style="transform:rotate(${t * 6}deg)"/><circle class="pin" cx="100" cy="100" r="7"/></svg>`;
  return s;
}
const setHands = (svg, t) => { if (!svg) return; svg.querySelector('.hh').style.transform = `rotate(${t / 2}deg)`; svg.querySelector('.mh').style.transform = `rotate(${t * 6}deg)`; };
const nearest = (cur, target) => { let d = norm(target - cur); if (d > 360) d -= 720; return cur + d; };
const LEGEND = '<div class="legend"><i style="background:var(--hand-h)"></i>短針＝時<i style="background:var(--hand-m)"></i>長針＝分</div>';
const CTRLS = act => `<div class="ctrls"><div class="ctrl"><span>短針（時）</span><button data-act="${act}" data-d="-60" aria-label="時針倒轉一小時">↺</button><button data-act="${act}" data-d="60" aria-label="時針順轉一小時">↻</button></div><div class="ctrl"><span>長針（分）</span><button data-act="${act}" data-d="-5" aria-label="分針倒轉五分鐘">↺</button><button data-act="${act}" data-d="5" aria-label="分針順轉五分鐘">↻</button></div></div>`;

/* scene: near / far, singular / plural */
function sceneHTML(sc) {
  const its = Array.from({ length: sc.n }, () => `<span>${ico(sc.item)}</span>`).join('');
  const spot = `<div class="spot ${sc.far ? 'far' : 'near'}">${sc.tag ? `<span class="tag">🏷️ ${esc(sc.tag)}</span>` : ''}<div class="its">${its}</div><span class="dist">${sc.far ? '遠 far' : '近 near'}</span></div>`;
  return `<div class="scene"><div class="kid"><span class="ke">🧒</span><span class="kn">${LEARNER}</span></div>${sc.far ? `<span class="hand">👉</span><div class="path"></div>${spot}` : `${spot}<div class="grow"></div>`}</div>`;
}

/* ===================== curriculum data ===================== */
const ROUTINES = [
  { e: '⏰', en: 'wake up', zh: '起床、醒來', ex: 'I wake up at 6:00 in the morning.' },
  { e: '🍳', en: 'have breakfast', zh: '吃早餐', ex: "It's 7:00. Time to have breakfast." },
  { e: '🍱', en: 'have lunch', zh: '吃午餐', ex: 'What time do you have lunch?' },
  { e: '🍲', en: 'have dinner', zh: '吃晚餐', ex: 'I have dinner at 5:30 in the evening.' },
  { e: '🚿', en: 'take a shower', zh: '洗澡、沖澡', ex: 'Time to take a shower.' },
  { e: '👕', en: 'get dressed', zh: '穿好衣服', ex: "It's late. It's time to get dressed!" },
  { e: '🪥', en: 'brush my teeth', zh: '刷牙', ex: 'I am brushing my teeth.' },
  { e: '💇', en: 'comb my hair', zh: '梳頭髮', ex: 'He combs his hair every morning.' },
  { e: '📝', en: 'do my homework', zh: '寫功課', ex: "It's time to do my homework." },
  { e: '🧹', en: 'clean my room', zh: '整理房間', ex: 'He cleans his room at 9:45 at night.' },
  { e: '🏫', en: 'arrive at school', zh: '抵達學校', ex: 'I arrive at school at 8:00 in the morning.' },
  { e: '💬', en: 'chat with friends', zh: '和朋友聊天', ex: 'Time to chat with friends.' }
];
const ITEMS = [
  { e: '🏫', en: 'classroom', pl: 'classrooms', zh: '教室' },
  { e: '👛', en: 'wallet', pl: 'wallets', zh: '皮夾、錢包' },
  { e: '🔑', en: 'key', pl: 'keys', zh: '鑰匙' },
  { e: '⌚', en: 'watch', pl: 'watches', zh: '手錶' },
  { e: '📱', en: 'smartphone', pl: 'smartphones', zh: '智慧型手機' },
  { e: '📓', en: 'notebook', pl: 'notebooks', zh: '筆記本' },
  { e: '🍱', en: 'lunch box', pl: 'lunch boxes', zh: '便當盒、午餐盒' },

/* ===================== state ===================== */
const app = $('#app');
let cur = 1, run = null, learnT = 450;
const starsHTML = n => `<span class="stars" aria-label="${n} 顆星">${[1, 2, 3].map(i => `<span class="${i <= n ? 'on' : ''}">★</span>`).join('')}</span>`;
const RATES = [[0.65, '🐢', '慢速'], [0.85, '🙂', '標準'], [1, '🐇', '快速']];
function updateTop() {
  $('#starNum').textContent = totalStars();
  const r = RATES.find(x => x[0] === save.rate) || RATES[1];
  $('#speedBtn').innerHTML = `${r[1]}<span class="lbl"> ${r[2]}</span>`;
  $('#soundBtn').textContent = save.sound ? '🔔' : '🔕';
}
function show(html, lv) {
  if (TTS.ok) { TTS.token++; speechSynthesis.cancel(); }
  app.innerHTML = lv ? `<div data-lv="${lv}">${html}</div>` : html;
  window.scrollTo(0, 0);
  updateTop();
}
/* two-tap confirm instead of native dialogs */
function armed(el, msg) {
  if (el.classList.contains('armed')) { el.classList.remove('armed'); return true; }
  el.classList.add('armed'); toast(msg);
  setTimeout(() => el.classList.remove('armed'), 3000);
  return false;
}

/* ===================== map ===================== */
function renderMap() {
  run = null;
  const total = totalStars(), allDone = LEVELS.every(L => save.best[L.n]);
  const todo = LEVELS.filter(L => !save.best[L.n]).map(L => L.n);
  const msg = allDone ? `${LEARNER} 全部過關了，好厲害！🎉 快去領取你的證書吧！`
    : total === 0 ? `Hi, ${LEARNER}! 👋 我是小企鵝 Penny。5 個關卡可以自由選，想先挑戰哪一關都可以，收集 15 顆星星吧！`
    : `繼續加油，${LEARNER}！還沒挑戰的關卡：第 ${todo.join('、')} 關。`;
  const lvCard = L => {
    const st = save.best[L.n] || 0;
    return `<button class="lv" data-lv="${L.n}" data-act="open" data-n="${L.n}">
      <span class="num"><b>${L.n}</b>${L.icon}</span>
      <span class="lv-t"><span class="t">${esc(L.title)}</span><span class="e">${esc(L.en)}</span><span class="s">${esc(L.sub)}</span>${starsHTML(st)}<span class="go">${st ? '再挑戰 ↻' : '開始 ▶'}</span></span>
    </button>`;
  };
  show(`
    <div class="hero">
      <div class="penny" aria-hidden="true">🐧</div>
      <div class="bubble"><p>${msg}</p><button class="say-btn" data-say="Hi, ${LEARNER}! I'm Penny, the little penguin. Let's go on an English adventure!">🔊 聽 Penny 說話</button></div>
    </div>
    ${UNITS.map(u => `<section class="unit" data-lv="${u.lv[0] === 5 ? 5 : u.lv[0]}">
      <div class="unit-h"><span class="tag">${u.tag}</span><h3>${u.title}</h3><span class="uzh">${u.zh}</span></div>
      <div class="levels">${u.lv.map(n => lvCard(LEVELS[n - 1])).join('')}</div>
    </section>`).join('')}
    ${allDone ? `<div class="row-c" data-lv="1"><button class="btn big" data-act="cert">🎓 領取 ${LEARNER} 的證書</button></div>` : ''}
    <footer class="foot">
      <div>📖 內容依據：Unit 1 What a Day!・Unit 2 In the Classroom・CLIL Reading 1・Review 1</div>
      <div>🔊 朗讀使用瀏覽器內建英文語音（建議使用 Chrome 或 Edge）${TTS.ok ? '' : '　⚠️ 這個瀏覽器不支援朗讀'}</div>
      <div class="links">
        <button class="link" data-act="reset">🗑️ 清除闖關紀錄</button>
      </div>
    </footer>`);
}

  return `<div class="lv-head">
      <button class="back" data-act="${mode === 'quiz' ? 'quit' : 'map'}" aria-label="回到地圖">←</button>
      <div class="num">${L.icon}</div>
      <div><div class="ut">${L.unit} ・ 第 ${L.n} 關</div><h2>${esc(L.title)}<small>${esc(L.en)}</small></h2></div>
    </div>
    <div class="steps">
      <button class="step${mode === 'learn' ? ' on' : ''}" ${mode === 'learn' ? 'disabled' : mode === 'result' ? 'data-act="learn"' : 'disabled'}>① 學習 Learn</button>
      <button class="step${mode !== 'learn' ? ' on' : ''}" ${mode === 'learn' ? 'data-act="quiz"' : 'disabled'}>② 挑戰 Challenge</button>
    </div>`;
}
const sec = (b, inner) => `<section class="card block"><h3>${b.title}</h3>${b.sub ? `<p class="sub">${b.sub}</p>` : ''}${inner}</section>`;

const sentBtn = (s, extra = '', cls = '') => `<button class="sent${cls}" data-say="${esc(plain(s[0]))}"><span class="en">${md(s[0])}${extra}</span><span class="zh">${esc(s[1])}</span></button>`;

/* ===================== quiz engine ===================== */
const ptsOf = q => q.type === 'sort' ? q.items.length : 1;
const catOf = q => q.cat || (q.type === 'hear' ? '🎧 聽力閱讀' : q.type === 'listen' ? '🎧 聽力・單字' : (q.type === 'clock' || q.clock) ? '⏰ 看時鐘' : q.type === 'sort' ? '🗂️ 分類' : q.type === 'order' ? '🧩 排句子' : '✏️ 句型');
function optsHTML(q) {

}
function playHear() {
  const q = run && run.q; if (!q || q.type !== 'hear') return;
  const nodes = $$('#htext .sent');

}
const fullOf = q => q.full || (q.type === 'order' ? q.w.join(' ') : q.type === 'clock' ? `It's ${q.h}:${pad(q.m)}.` : typeof q.o[0] === 'string' ? q.o[0] : q.o[0].t);
const sayOf = q => q.fullSay || fullOf(q);
const blank = s => esc(s).replace(/___/g, '<span class="blank">　?　</span>');

function startQuiz(n) {
  const L = LEVELS[n - 1]; cur = n;
  const qs = L.quiz.map(q => Object.assign({}, q, { tries: 0 }));
  run = { L, n, queue: qs, pos: 0, total: qs.reduce((s, q) => s + ptsOf(q), 0), done: 0, good: 0, missed: [], missedSort: [], retry: [], retryMode: false, locked: false };

}
function advance() {
  if (run.pos < run.queue.length) { run.q = run.queue[run.pos]; run.locked = false; renderQ(); return; }
  if (run.retry.length) {
    const intro = !run.retryMode;
    run.queue = run.retry; run.retry = []; run.pos = 0; run.retryMode = true;
    if (intro) return showRetryIntro();

}
function barHTML() {
  if (run.retryMode) return `<div class="qbar"><span class="qcount">🔁 錯題再練 ${run.pos + 1} / ${run.queue.length}</span><div class="track"><div class="fill" style="width:${run.pos / run.queue.length * 100}%"></div></div></div>`;
  return `<div class="qbar"><div class="track"><div class="fill" id="fill" style="width:${run.done / run.total * 100}%"></div></div><span class="qcount" id="qcount">${run.done} / ${run.total}</span></div>`;
}
function updateBar() {
  if (run.retryMode) return;
  const f = $('#fill'); if (f) f.style.width = `${run.done / run.total * 100}%`;
  const c = $('#qcount'); if (c) c.textContent = `${run.done} / ${run.total}`;
}
function visualHTML(q) {
  let v = '';
  if (q.clock) v += `<div class="clockbox">${clockSVG(q.clock[0] * 60 + q.clock[1])}${LEGEND}</div>`;
  if (q.scene) v += sceneHTML(q.scene);
  if (q.lead) v += `<div class="lead">${ico(q.lead)}</div>`;

}
function renderQ() {

    body = `<p class="prompt">排一排，組成正確的句子！</p><p class="qzh">${esc(q.zh)}</p>
      <div class="ans-line" id="ansLine"></div>
      <div class="bank" id="bank">${run.tiles.map((t, k) => `<button class="wt" data-act="tile" data-k="${k}">${esc(t)}</button>`).join('')}</div>
      <div class="row-c"><button class="btn ghost" data-act="tclear">↺ 重排</button><button class="btn" id="chk" data-act="tcheck" disabled>檢查 ✔</button></div>`;
  } else if (q.type === 'clock') {
    run.t = 720;
    const tgt = `It's ${q.h}:${pad(q.m)}.`;
    body = `<p class="prompt sm">轉動指針，把時鐘撥到：</p><p class="target">${tgt} <button class="say-btn" data-say="${tgt}" aria-label="聽">🔊</button></p>
      <div class="clockbox">${clockSVG(720, 'qclock')}${LEGEND}${CTRLS('qclk')}</div>
      <div class="row-c"><button class="btn" data-act="ccheck">檢查 ✔</button></div>`;
  } else if (q.type === 'sort') {
    run.items = shuffle(q.items).map(it => Object.assign({}, it, { miss: false })); run.si = 0;
    body = `<p class="prompt">${esc(q.p)}</p><div class="sort-stage" id="stage"></div>

      <div class="sort-msg" id="sortMsg" aria-live="polite"></div>`;
  } else if (q.type === 'hear') {
    body = `<button class="big-listen" data-act="hplay" aria-label="播放短文和問題">🎧</button>
      <p class="prompt sm">聽短文和問題，選出正確的答案！</p>
      <div class="row-c" style="margin-top:8px"><button class="say-btn" data-act="hplay">▶ 再聽一次</button><button class="say-btn" data-say="${esc(q.ask)}">❓ 只聽問題</button><button class="say-btn" data-act="htext">📖 看文字</button></div>
      <div class="htext" id="htext" hidden><div class="story">${q.talk.map(t => `<button class="sent" data-say="${esc(t)}">${esc(t)}</button>`).join('')}<button class="sent hq" data-say="${esc(q.ask)}">❓ ${esc(q.ask)}</button></div></div>

      : `<p class="prompt">${blank(q.p)}${q.say ? ` <button class="say-btn" data-say="${esc(q.say)}" aria-label="聽題目">🔊</button>` : ''}</p>${q.zh ? `<p class="qzh">${esc(q.zh)}</p>` : ''}`;

function lockCard() { $$('#qcard button').forEach(b => { if (!b.dataset.say) b.disabled = true; }); }
function resolve(ok) {
  const q = run.q;
  if (!run.retryMode) { run.done++; if (ok) run.good++; else { run.missed.push(q); run.retry.push(q); } }
  else if (!ok && ++q.tries < 2) run.retry.push(q);
  updateBar(); feedback(ok, q);
}
function feedback(ok, q, extra = '') {

  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">
    <div class="fb-h">${ok ? '✅' : '💡'} ${esc(en)} ${ok ? pick(ZH_OK) : '看看正確答案：'}</div>
    <div class="fb-ans">${esc(full)} <button class="say-btn" data-say="${esc(sayOf(q))}" aria-label="再聽一次">🔊</button></div>
    ${q.why ? `<div class="fb-why">📌 ${esc(q.why)}</div>` : ''}${extra}
    <button class="btn" data-act="next">繼續 ➜</button></div>`;
  if (ok) { SFX.good(); confetti(36); } else SFX.bad();
  TTS.say(ok ? `${en} ${sayOf(q)}` : `${en} The answer is: ${sayOf(q)}`);
  const nb = $('#fb .btn'); nb.focus({ preventScroll: true });
  $('#fb').scrollIntoView({ block: 'nearest', behavior: 'smooth' });

function answerChoice(btn) {

  box.classList.add('done');
  $$('.opt', box).forEach(b => { b.disabled = true; if (b.dataset.ok === '1') b.classList.add('ok'); });

function checkClock() {

function finish() {

  save.best[run.n] = Math.max(prev, stars); persist();
  const L = run.L, n = run.n;
  const msg = stars === 3 ? `滿分表現！${LEARNER} 太厲害了！` : stars === 2 ? '很棒！再挑戰一次就有機會拿到 3 顆星！' : '完成關卡了！看看下面的錯題，再挑戰一次會更好！';
  const qLabel = q => q.type === 'hear' ? `🎧 聽力閱讀：${q.ask}` : q.type === 'listen' ? `🎧 聽力：${q.say}` : q.type === 'order' ? `🧩 排句子：${q.zh}` : q.type === 'clock' ? '⏰ 撥時鐘' : `${q.clock ? '⏰ 看時鐘：' : '❓ '}${q.p.replace(/___/g, '＿＿')}`;
  const items = run.missed.map(q => `<li><span class="mq">${esc(qLabel(q))}</span><span class="ma">✔ ${esc(fullOf(q))}</span><button class="say-btn" data-say="${esc(sayOf(q))}" aria-label="聽">🔊</button></li>`)
    .concat(run.missedSort.map(s => `<li><span class="mq">🗂️ 分類：${esc(s.w)}</span><span class="ma">✔ ${esc(s.bin)}</span><button class="say-btn" data-say="${esc(s.w)}" aria-label="聽">🔊</button></li>`));
  const allDone = LEVELS.every(x => save.best[x.n]);
  const nextBtn = (allDone ? '<button class="btn" data-act="cert">🎓 領取證書</button>' : '') + (n < 5 ? `<button class="btn" data-act="open" data-n="${n + 1}">下一關 ▶</button>` : '');
  show(`${levelHead(L, 'result')}<section class="card center">
      <div class="big-stars">${[1, 2, 3].map(i => `<span class="${i <= stars ? 'on' : ''}">★</span>`).join('')}</div>
      <h3>第 ${n} 關完成！</h3>
      <p class="score">第一次就答對 ${run.good} / ${run.total}（${Math.round(pct * 100)}%）</p>
      <p style="margin-top:6px">${msg}</p>
      ${prev === 0 && allDone ? '<span class="unlock">🎓 5 關都完成了，可以領取證書囉！</span>' : ''}
      ${prev && stars > prev ? `<span class="unlock">⬆️ 刷新紀錄：${prev} → ${stars} 顆星</span>` : ''}
      ${items.length ? `<div class="review"><h4>📒 錯題回顧（點 🔊 再聽一次）</h4><ul>${items.join('')}</ul></div>` : ''}

    </section>`, n);

      <p>This certifies that</p>
      <div class="name">${LEARNER}</div>
      <p>完成了 Unit 1「What a Day!」、Unit 2「In the Classroom」<br>與總複習的全部 5 個關卡！</p>
      <div class="lvls">${LEVELS.map(L => `<span>${L.icon} 第 ${L.n} 關 ${'★'.repeat(save.best[L.n] || 0)}</span>`).join('')}</div>
      <div class="total">⭐ ${totalStars()} / 15</div>
      <div class="d">${d}　・　小企鵝 Penny 🐧 頒發</div>
    </div>
    <div class="row-c no-print" data-lv="1"><button class="btn ghost" data-act="map">🗺️ 回到地圖</button>${CAN_PRINT ? '<button class="btn" data-act="print">🖨️ 列印證書</button>' : ''}</div>
    ${CAN_PRINT ? '' : '<p class="center no-print" style="color:var(--muted);margin-top:10px">📸 想保存證書，可以直接截圖喔！</p>'}`);
  SFX.fanfare(); confetti(200);
  TTS.say(`Congratulations, ${LEARNER}! You are an English superstar!`);
}

/* ===================== events ===================== */
const ACTS = {
  map: () => renderMap(),
  open: el => { SFX.pop(); renderLearn(LEVELS[+el.dataset.n - 1]); },
  learn: () => { SFX.pop(); renderLearn(LEVELS[cur - 1]); },
  quiz: () => { SFX.pop(); startQuiz(cur); },
  quit: el => { if (armed(el, '再按一次 ← 離開（這次的作答不會記錄）')) renderMap(); },
  pick: el => answerChoice(el),
  next: () => { if (!run) return; run.pos++; advance(); },
  retrygo: () => { run.q = run.queue[0]; run.locked = false; renderQ(); },
  tile: el => { if (run.locked) return; const k = +el.dataset.k; if (run.picked.includes(k)) return; run.picked.push(k); SFX.pop(); TTS.say(run.tiles[k]); renderOrderLine(); },
  untile: el => { if (run.locked) return; const k = +el.dataset.k; run.picked = run.picked.filter(x => x !== k); renderOrderLine(); },
  tclear: () => { if (run.locked) return; run.picked = []; renderOrderLine(); },
  tcheck: () => checkOrder(),
  qclk: el => { if (run.locked) return; run.t += +el.dataset.d; setHands($('#qclock'), run.t); SFX.pop(); },
  ccheck: () => checkClock(),
  hplay: () => playHear(),
  htext: () => { const h = $('#htext'); if (h) h.hidden = !h.hidden; },
  bin: el => dropBin(el.dataset.k, el),
  lclk: el => { learnT += +el.dataset.d; updLearnClock(); },
  preset: el => { const [h, m] = el.dataset.t.split(':').map(Number); learnT = nearest(learnT, h * 60 + m); updLearnClock(); },
  lsay: () => TTS.say(`What time is it? It's ${fmtT(learnT)}.`),
  readall: el => readAll(+el.dataset.b),
  zh: () => app.classList.toggle('hide-zh'),
  speed: () => { const i = RATES.findIndex(x => x[0] === save.rate); save.rate = RATES[(i + 1) % RATES.length][0]; persist(); updateTop(); TTS.say(`Hello, ${LEARNER}!`); },
  sound: () => { save.sound = !save.sound; persist(); updateTop(); SFX.pop(); },
  reset: el => { if (!armed(el, `再按一次，就會清除 ${LEARNER} 的所有星星紀錄`)) return; save.best = {}; persist(); renderMap(); toast('已清除闖關紀錄'); },
  cert: () => renderCert(),
  print: () => window.print()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-say]');
  if (!el || el.disabled) return;
  if (el.dataset.say !== undefined) {
    TTS.say(el.dataset.say);
    const card = el.closest('.tile,.ph-w,.s4c,.poss-c,.sent,.line') || el;
    card.classList.add('playing'); setTimeout(() => card.classList.remove('playing'), 700);
  }
  const fn = ACTS[el.dataset.act];
  if (fn) fn(el, e);
});

$('#brandName').textContent = `${LEARNER}'s English Adventure`;
document.title = `${LEARNER}'s English Adventure`;
renderMap();
})();
</script>
</body>
</html>
